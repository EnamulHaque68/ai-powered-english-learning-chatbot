name: Build & Test CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore ChildLearningChatbot.sln

      - name: Build Backend Solution
        run: dotnet build ChildLearningChatbot.sln --no-restore --configuration Release

      - name: Run Backend Automated Tests
        run: dotnet test ChildLearningChatbot.sln --no-build --configuration Release --verbosity normal

  frontend-build:
    name: Frontend Build (Angular 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular Frontend (Production)
        working-directory: ./frontend
        run: npm run build -- --configuration production
